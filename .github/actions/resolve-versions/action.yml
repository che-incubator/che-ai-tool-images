name: 'Resolve Tool Versions'
description: >
  Resolves tool versions by inspecting tools-injector container images.
  Reads the TOOL_VERSION env var baked into each image,
  resolves image digests for reproducible builds, and computes immutable
  dated build tags in the form {version}-{YYYYMMDD}-{sha7}.

inputs:
  sha:
    description: 'Full Git SHA — first 7 chars are appended to the build tag'
    required: true
  source_tag:
    description: 'Tag to pull from tools-injector images (default: next)'
    required: false
    default: 'next'

outputs:
  claude:
    description: 'Resolved Claude Code version'
    value: ${{ steps.resolve.outputs.claude }}
  gemini:
    description: 'Resolved Gemini CLI version'
    value: ${{ steps.resolve.outputs.gemini }}
  opencode:
    description: 'Resolved OpenCode version'
    value: ${{ steps.resolve.outputs.opencode }}
  claude_tag:
    description: 'Immutable build tag for claude-code'
    value: ${{ steps.resolve.outputs.claude_tag }}
  gemini_tag:
    description: 'Immutable build tag for gemini-cli'
    value: ${{ steps.resolve.outputs.gemini_tag }}
  opencode_tag:
    description: 'Immutable build tag for opencode'
    value: ${{ steps.resolve.outputs.opencode_tag }}
  claude_source:
    description: 'Digest-pinned source image for claude-code'
    value: ${{ steps.resolve.outputs.claude_source }}
  gemini_source:
    description: 'Digest-pinned source image for gemini-cli'
    value: ${{ steps.resolve.outputs.gemini_source }}
  opencode_source:
    description: 'Digest-pinned source image for opencode'
    value: ${{ steps.resolve.outputs.opencode_source }}
  goose:
    description: 'Resolved Goose version'
    value: ${{ steps.resolve.outputs.goose }}
  goose_tag:
    description: 'Immutable build tag for goose'
    value: ${{ steps.resolve.outputs.goose_tag }}
  goose_source:
    description: 'Digest-pinned source image for goose'
    value: ${{ steps.resolve.outputs.goose_source }}
  kilocode:
    description: 'Resolved Kilocode version'
    value: ${{ steps.resolve.outputs.kilocode }}
  kilocode_tag:
    description: 'Immutable build tag for kilocode'
    value: ${{ steps.resolve.outputs.kilocode_tag }}
  kilocode_source:
    description: 'Digest-pinned source image for kilocode'
    value: ${{ steps.resolve.outputs.kilocode_source }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        INPUT_SHA: ${{ inputs.sha }}
        SOURCE_TAG: ${{ inputs.source_tag }}
        REGISTRY: quay.io/che-incubator/tools-injector
      run: |
        set -euo pipefail

        resolve_tool() {
          local TOOL="$1"
          local KEY="$2"
          local REQUIRED_ARCHES="$3"
          local IMAGE="${REGISTRY}/${TOOL}:${SOURCE_TAG}"

          # Resolve the manifest list digest (OCI index) for reproducible
          # multi-arch builds. Using --override-arch would return a single-arch
          # manifest digest, causing buildx to use that arch for all platforms.
          local RAW_MANIFEST DIGEST
          RAW_MANIFEST=$(skopeo inspect --raw "docker://${IMAGE}")
          DIGEST="sha256:$(echo -n "$RAW_MANIFEST" | sha256sum | awk '{print $1}')"

          # Validate required platforms exist in the manifest list
          local PLATFORMS ARCH
          PLATFORMS=$(echo "$RAW_MANIFEST" | \
            jq -r '[.manifests[]?.platform | select(.os == "linux") | .architecture] | sort | join(",")' 2>/dev/null || echo "")
          for ARCH in $REQUIRED_ARCHES; do
            if [[ ",${PLATFORMS}," != *",${ARCH},"* ]]; then
              echo "::error::${IMAGE} is missing required platform linux/${ARCH} (found: ${PLATFORMS:-none})"
              exit 1
            fi
          done

          # Extract version from TOOL_VERSION env var baked into the image
          local VERSION SOURCE
          SOURCE="${REGISTRY}/${TOOL}@${DIGEST}"
          VERSION=$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${SOURCE}" 2>/dev/null \
            | grep '^TOOL_VERSION=' | cut -d= -f2 || true)
          # Strip leading 'v' prefix if present (e.g. v1.39.0 -> 1.39.0)
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read TOOL_VERSION from ${SOURCE}. Is the image built with ENV TOOL_VERSION?"
            exit 1
          fi

          local DATE SHA7 TAG
          DATE=$(date +%Y%m%d)
          SHA7="${INPUT_SHA:0:7}"
          TAG="${VERSION}-${DATE}-${SHA7}"

          echo "${TOOL} version: ${VERSION}, tag: ${TAG}, source: ${SOURCE}"

          echo "${KEY}=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "${KEY}_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "${KEY}_source=${SOURCE}" >> "$GITHUB_OUTPUT"
        }

        resolve_tool "claude-code" "claude" "amd64 arm64"
        resolve_tool "gemini-cli" "gemini" "amd64 arm64 s390x ppc64le"
        resolve_tool "opencode" "opencode" "amd64 arm64"
        resolve_tool "goose" "goose" "amd64 arm64"
        resolve_tool "kilocode" "kilocode" "amd64 arm64"
