name: 'Resolve Tool Versions'
description: >
  Resolves tool versions from tools-injector images via skopeo inspect,
  reading the org.opencontainers.image.version label. Falls back to the
  image digest prefixed with sha- if the label is absent. Computes
  immutable dated build tags in the form {version}-{YYYYMMDD}-{sha7}.

inputs:
  sha:
    description: 'Full Git SHA — first 7 chars are appended to the build tag'
    required: true
  claude_override:
    description: 'Override CLAUDE_CODE_VERSION (empty = use tools-injector label)'
    required: false
    default: ''
  gemini_override:
    description: 'Override GEMINI_CLI_VERSION (empty = use tools-injector label)'
    required: false
    default: ''
  opencode_override:
    description: 'Override OPENCODE_VERSION without leading v (empty = use tools-injector label)'
    required: false
    default: ''

outputs:
  claude:
    description: 'Resolved Claude Code version'
    value: ${{ steps.resolve.outputs.claude }}
  gemini:
    description: 'Resolved Gemini CLI version'
    value: ${{ steps.resolve.outputs.gemini }}
  opencode:
    description: 'Resolved OpenCode version (no leading v)'
    value: ${{ steps.resolve.outputs.opencode }}
  claude_tag:
    description: 'Immutable build tag for claude-code: {version}-{YYYYMMDD}-{sha7}'
    value: ${{ steps.resolve.outputs.claude_tag }}
  gemini_tag:
    description: 'Immutable build tag for gemini-cli: {version}-{YYYYMMDD}-{sha7}'
    value: ${{ steps.resolve.outputs.gemini_tag }}
  opencode_tag:
    description: 'Immutable build tag for opencode: {version}-{YYYYMMDD}-{sha7}'
    value: ${{ steps.resolve.outputs.opencode_tag }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        INPUT_CLAUDE: ${{ inputs.claude_override }}
        INPUT_GEMINI: ${{ inputs.gemini_override }}
        INPUT_OPENCODE: ${{ inputs.opencode_override }}
        INPUT_SHA: ${{ inputs.sha }}
      run: |
        # Resolve version from a tools-injector image via skopeo inspect.
        # Reads org.opencontainers.image.version label; falls back to sha-<digest7>.
        resolve_version_from_image() {
          local image="$1"
          local version=""
          if command -v skopeo &>/dev/null; then
            version=$(skopeo inspect --no-creds "docker://${image}" 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('Labels',{}).get('org.opencontainers.image.version',''))" 2>/dev/null || true)
          fi
          if [[ -z "$version" ]] && command -v docker &>/dev/null; then
            version=$(docker manifest inspect "${image}" 2>/dev/null \
              | python3 -c "
import sys, json
d = json.load(sys.stdin)
for m in d.get('manifests', [d]):
    lbl = m.get('annotations', {})
    if not lbl:
        lbl = m.get('config', {}).get('Labels', {})
    v = lbl.get('org.opencontainers.image.version', '')
    if v:
        print(v)
        break
" 2>/dev/null || true)
          fi
          if [[ -z "$version" ]]; then
            local digest=""
            if command -v skopeo &>/dev/null; then
              digest=$(skopeo inspect --no-creds --format "{{.Digest}}" "docker://${image}" 2>/dev/null | sed 's/sha256://' | cut -c1-7 || true)
            fi
            if [[ -n "$digest" ]]; then
              version="sha-${digest}"
            fi
          fi
          echo "$version"
        }

        CLAUDE_IMAGE="quay.io/che-incubator/tools-injector/claude-code:next"
        GEMINI_IMAGE="quay.io/che-incubator/tools-injector/gemini-cli:next"
        OPENCODE_IMAGE="quay.io/che-incubator/tools-injector/opencode:next"

        if [[ -n "$INPUT_CLAUDE" ]]; then
          CLAUDE="$INPUT_CLAUDE"
        else
          CLAUDE=$(resolve_version_from_image "$CLAUDE_IMAGE")
        fi

        if [[ -n "$INPUT_GEMINI" ]]; then
          GEMINI="$INPUT_GEMINI"
        else
          GEMINI=$(resolve_version_from_image "$GEMINI_IMAGE")
        fi

        if [[ -n "$INPUT_OPENCODE" ]]; then
          OPENCODE="$INPUT_OPENCODE"
        else
          OPENCODE=$(resolve_version_from_image "$OPENCODE_IMAGE")
          OPENCODE="${OPENCODE#v}"
        fi

        [[ -n "$CLAUDE" ]]   || { echo "::error::Failed to resolve claude version from ${CLAUDE_IMAGE} — label org.opencontainers.image.version absent and digest unavailable"; exit 1; }
        [[ -n "$GEMINI" ]]   || { echo "::error::Failed to resolve gemini version from ${GEMINI_IMAGE} — label org.opencontainers.image.version absent and digest unavailable"; exit 1; }
        [[ -n "$OPENCODE" ]] || { echo "::error::Failed to resolve opencode version from ${OPENCODE_IMAGE} — label org.opencontainers.image.version absent and digest unavailable"; exit 1; }

        DATE=$(date +%Y%m%d)
        SHA7="${INPUT_SHA:0:7}"

        echo "claude=${CLAUDE}"          >> "$GITHUB_OUTPUT"
        echo "gemini=${GEMINI}"          >> "$GITHUB_OUTPUT"
        echo "opencode=${OPENCODE}"      >> "$GITHUB_OUTPUT"
        echo "claude_tag=${CLAUDE}-${DATE}-${SHA7}"    >> "$GITHUB_OUTPUT"
        echo "gemini_tag=${GEMINI}-${DATE}-${SHA7}"    >> "$GITHUB_OUTPUT"
        echo "opencode_tag=${OPENCODE}-${DATE}-${SHA7}" >> "$GITHUB_OUTPUT"
