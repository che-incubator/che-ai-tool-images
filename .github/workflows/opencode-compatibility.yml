name: OpenCode injection compatibility

on:
  workflow_dispatch:
  push:
    paths:
      - 'dockerfiles/opencode/**'
      - 'dockerfiles/opencode-node/**'
      - 'tests/opencode-*'
      - 'registry.json'
      - '.github/workflows/*'
  pull_request:
    paths:
      - 'dockerfiles/opencode/**'
      - 'dockerfiles/opencode-node/**'
      - 'tests/opencode-*'
      - 'registry.json'
      - '.github/workflows/*'

permissions:
  contents: read

jobs:
  injection:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, s390x]
    steps:
      - uses: actions/checkout@v4
      - name: Resolve versions
        id: versions
        uses: ./.github/actions/resolve-versions
        with:
          sha: ${{ github.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Select architecture-specific build
        id: build
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [ "$ARCH" = s390x ]; then
            echo 'context=.' >> "$GITHUB_OUTPUT"
            echo 'file=dockerfiles/opencode/Dockerfile.s390x' >> "$GITHUB_OUTPUT"
          else
            echo 'context=./dockerfiles/opencode' >> "$GITHUB_OUTPUT"
            echo 'file=dockerfiles/opencode/Dockerfile' >> "$GITHUB_OUTPUT"
          fi
      - name: Build without publishing
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.build.outputs.context }}
          file: ${{ steps.build.outputs.file }}
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          build-args: |
            OPENCODE_VERSION=v${{ steps.versions.outputs.opencode }}
            TOOL_IMAGES_REVISION=${{ github.sha }}
          tags: opencode-compatibility:${{ matrix.arch }}
      - name: Check injected CLI with a read-only root and arbitrary UID
        env:
          ARCH: ${{ matrix.arch }}
          OPENCODE_VERSION: ${{ steps.versions.outputs.opencode }}
        run: |
          docker run --rm --platform "linux/$ARCH" --user 10001 \
            --network none --read-only --tmpfs /tmp:rw,exec,mode=1777 \
            -v "$PWD/tests:/validation:ro" \
            -e "OPENCODE_EXPECTED_VERSION=$OPENCODE_VERSION" \
            --entrypoint sh "opencode-compatibility:$ARCH" \
            /validation/opencode-injection-smoke.sh
      - name: Check the bundle in separate workspace images
        if: matrix.arch == 's390x'
        run: |
          docker buildx build --platform linux/s390x --load \
            -f tests/Dockerfile.opencode-workspace -t opencode-workspace-minimal .
          sh tests/opencode-workspace-smoke.sh \
            opencode-compatibility:s390x opencode-workspace-minimal
          sh tests/opencode-workspace-smoke.sh \
            opencode-compatibility:s390x \
            quay.io/devspaces/udi-rhel9@sha256:54d0409c80ce6fc2026612b900af89f5bfe354f4d96e71b2caf531e95d5fe895
      - name: Export the validated image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker save "opencode-compatibility:$ARCH" | gzip > "opencode-$ARCH.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: opencode-image-${{ matrix.arch }}
          path: opencode-${{ matrix.arch }}.tar.gz
          retention-days: 1
          compression-level: 0
