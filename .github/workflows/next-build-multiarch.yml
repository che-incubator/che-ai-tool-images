name: Next Build - Multiarch

on:
  workflow_dispatch:
    inputs: {}
  push:
    branches:
      - main

env:
  REGISTRY: quay.io/che-incubator/dashboard-ai

jobs:

  build:
    runs-on: ubuntu-22.04
    steps:
      -
        name: "Checkout source code"
        uses: actions/checkout@v4
      -
        name: "Resolve versions"
        id: versions
        uses: ./.github/actions/resolve-versions
        with:
          sha: ${{ github.sha }}
      -
        name: "Set up QEMU"
        uses: docker/setup-qemu-action@v3
      -
        name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
      -
        name: "Login to Quay.io"
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      -
        name: "Build and push claude-code"
        uses: docker/build-push-action@v5
        with:
          context: ./dockerfiles/claude-code
          file: ./dockerfiles/claude-code/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/claude-code:next
            ${{ env.REGISTRY }}/claude-code:${{ steps.versions.outputs.claude_tag }}
      -
        name: "Build and push gemini-cli"
        uses: docker/build-push-action@v5
        with:
          context: ./dockerfiles/gemini-cli
          file: ./dockerfiles/gemini-cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/gemini-cli:next
            ${{ env.REGISTRY }}/gemini-cli:${{ steps.versions.outputs.gemini_tag }}
      -
        name: "Build and push opencode"
        uses: docker/build-push-action@v5
        with:
          context: ./dockerfiles/opencode
          file: ./dockerfiles/opencode/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/opencode:next
            ${{ env.REGISTRY }}/opencode:${{ steps.versions.outputs.opencode_tag }}
      -
        name: "Build summary"
        run: |
          echo "## Next Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Tags pushed |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`claude-code\` | \`next\`, \`${{ steps.versions.outputs.claude_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`gemini-cli\`  | \`next\`, \`${{ steps.versions.outputs.gemini_tag }}\` |"  >> "$GITHUB_STEP_SUMMARY"
          echo "| \`opencode\`    | \`next\`, \`${{ steps.versions.outputs.opencode_tag }}\` |"   >> "$GITHUB_STEP_SUMMARY"
