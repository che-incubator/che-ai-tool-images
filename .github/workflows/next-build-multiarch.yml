name: Next Build - Multiarch

on:
  workflow_dispatch:
    inputs: {}
  push:
    branches:
      - main

env:
  REGISTRY: quay.io/che-incubator/dashboard-ai

jobs:

  build:
    runs-on: ubuntu-22.04
    steps:
      -
        name: "Checkout source code"
        uses: actions/checkout@v4
      -
        name: "Resolve versions"
        id: versions
        uses: ./.github/actions/resolve-versions
        with:
          sha: ${{ github.sha }}
      -
        name: "Set up QEMU"
        uses: docker/setup-qemu-action@v3
      -
        name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
      -
        name: "Login to Quay.io"
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      -
        name: "Build and push claude-code"
        uses: docker/build-push-action@v5
        with:
          context: ./dockerfiles/claude-code
          file: ./dockerfiles/claude-code/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/claude-code:next
            ${{ env.REGISTRY }}/claude-code:${{ steps.versions.outputs.claude_tag }}
      -
        name: "Build and push gemini-cli"
        uses: docker/build-push-action@v5
        with:
          context: ./dockerfiles/gemini-cli
          file: ./dockerfiles/gemini-cli/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/gemini-cli:next
            ${{ env.REGISTRY }}/gemini-cli:${{ steps.versions.outputs.gemini_tag }}
      -
        name: "Build OpenCode amd64/arm64"
        id: opencode_binary
        uses: docker/build-push-action@v5
        with:
          context: ./dockerfiles/opencode
          file: ./dockerfiles/opencode/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: |
            OPENCODE_VERSION=v${{ steps.versions.outputs.opencode }}
          outputs: type=image,name=${{ env.REGISTRY }}/opencode,push-by-digest=true,name-canonical=true,push=true
      - name: "Build OpenCode s390x/ppc64le headless CLI"
        id: opencode_node
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfiles/opencode/Dockerfile.node
          platforms: linux/s390x,linux/ppc64le
          provenance: false
          build-args: |
            OPENCODE_VERSION=v${{ steps.versions.outputs.opencode }}
            TOOL_IMAGES_REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/opencode,push-by-digest=true,name-canonical=true,push=true
      - name: "Verify OpenCode injection on every architecture"
        env:
          OPENCODE_IMAGE: ${{ env.REGISTRY }}/opencode
          OPENCODE_BINARY_DIGEST: ${{ steps.opencode_binary.outputs.digest }}
          OPENCODE_NODE_DIGEST: ${{ steps.opencode_node.outputs.digest }}
          OPENCODE_VERSION: ${{ steps.versions.outputs.opencode }}
        run: |
          for arch in amd64 arm64 s390x ppc64le; do
            digest="$OPENCODE_BINARY_DIGEST"
            case "$arch" in s390x|ppc64le) digest="$OPENCODE_NODE_DIGEST" ;; esac
            docker run --rm --platform "linux/$arch" --user 10001 \
              --read-only --tmpfs /tmp:rw,exec,mode=1777 \
              -v "$PWD/tests:/validation:ro" \
              -e "OPENCODE_EXPECTED_VERSION=$OPENCODE_VERSION" \
              --entrypoint sh "$OPENCODE_IMAGE@$digest" \
              /validation/opencode-injection-smoke.sh
          done
      - name: "Publish OpenCode multiarch tags"
        env:
          OPENCODE_IMAGE: ${{ env.REGISTRY }}/opencode
          OPENCODE_BINARY_DIGEST: ${{ steps.opencode_binary.outputs.digest }}
          OPENCODE_NODE_DIGEST: ${{ steps.opencode_node.outputs.digest }}
          OPENCODE_VERSION_TAG: ${{ steps.versions.outputs.opencode_tag }}
        run: |
          docker buildx imagetools create --dry-run \
            "$OPENCODE_IMAGE@$OPENCODE_BINARY_DIGEST" \
            "$OPENCODE_IMAGE@$OPENCODE_NODE_DIGEST" > opencode-index.json
          jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64", "linux/ppc64le", "linux/s390x"]' opencode-index.json
          docker buildx imagetools create \
            --tag "$OPENCODE_IMAGE:next" --tag "$OPENCODE_IMAGE:$OPENCODE_VERSION_TAG" \
            "$OPENCODE_IMAGE@$OPENCODE_BINARY_DIGEST" \
            "$OPENCODE_IMAGE@$OPENCODE_NODE_DIGEST"
      -
        name: "Build summary"
        run: |
          echo "## Next Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Tags pushed |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`claude-code\` | \`next\`, \`${{ steps.versions.outputs.claude_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`gemini-cli\`  | \`next\`, \`${{ steps.versions.outputs.gemini_tag }}\` |"  >> "$GITHUB_STEP_SUMMARY"
          echo "| \`opencode\`    | \`next\`, \`${{ steps.versions.outputs.opencode_tag }}\` |"   >> "$GITHUB_STEP_SUMMARY"
