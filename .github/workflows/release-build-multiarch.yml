name: Release Build - Multiarch

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Tag to pull from tools-injector images (default: next)"
        required: false
        default: 'next'

env:
  REGISTRY: quay.io/che-incubator/dashboard-ai

jobs:

  release:
    runs-on: ubuntu-22.04
    steps:
      -
        name: "Checkout source code"
        uses: actions/checkout@v4
      -
        name: "Resolve versions"
        id: versions
        uses: ./.github/actions/resolve-versions
        with:
          sha: ${{ github.sha }}
          source_tag: ${{ github.event.inputs.source_tag || 'next' }}
      -
        name: "Set up QEMU"
        uses: docker/setup-qemu-action@v3
      -
        name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
      -
        name: "Login to Quay.io"
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      -
        name: "Build and push claude-code"
        uses: docker/build-push-action@v5
        with:
          context: ./dockerfiles/claude-code
          file: ./dockerfiles/claude-code/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            SOURCE_IMAGE=${{ steps.versions.outputs.claude_source }}
          tags: |
            ${{ env.REGISTRY }}/claude-code:latest
            ${{ env.REGISTRY }}/claude-code:${{ steps.versions.outputs.claude_tag }}
      -
        name: "Build and push gemini-cli"
        uses: docker/build-push-action@v5
        with:
          context: ./dockerfiles/gemini-cli
          file: ./dockerfiles/gemini-cli/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
          push: true
          provenance: false
          build-args: |
            SOURCE_IMAGE=${{ steps.versions.outputs.gemini_source }}
          tags: |
            ${{ env.REGISTRY }}/gemini-cli:latest
            ${{ env.REGISTRY }}/gemini-cli:${{ steps.versions.outputs.gemini_tag }}
      -
        name: "Build and push opencode"
        uses: docker/build-push-action@v5
        with:
          context: ./dockerfiles/opencode
          file: ./dockerfiles/opencode/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            SOURCE_IMAGE=${{ steps.versions.outputs.opencode_source }}
          tags: |
            ${{ env.REGISTRY }}/opencode:latest
            ${{ env.REGISTRY }}/opencode:${{ steps.versions.outputs.opencode_tag }}
      -
        name: "Build and push goose"
        uses: docker/build-push-action@v5
        with:
          context: ./dockerfiles/goose
          file: ./dockerfiles/goose/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            SOURCE_IMAGE=${{ steps.versions.outputs.goose_source }}
          tags: |
            ${{ env.REGISTRY }}/goose:latest
            ${{ env.REGISTRY }}/goose:${{ steps.versions.outputs.goose_tag }}
      -
        name: "Build and push kilocode"
        uses: docker/build-push-action@v5
        with:
          context: ./dockerfiles/kilocode
          file: ./dockerfiles/kilocode/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            SOURCE_IMAGE=${{ steps.versions.outputs.kilocode_source }}
          tags: |
            ${{ env.REGISTRY }}/kilocode:latest
            ${{ env.REGISTRY }}/kilocode:${{ steps.versions.outputs.kilocode_tag }}
      -
        name: "Release summary"
        run: |
          echo "## Release Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Tags pushed |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`claude-code\` | \`latest\`, \`${{ steps.versions.outputs.claude_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`gemini-cli\`  | \`latest\`, \`${{ steps.versions.outputs.gemini_tag }}\` |"  >> "$GITHUB_STEP_SUMMARY"
          echo "| \`opencode\`    | \`latest\`, \`${{ steps.versions.outputs.opencode_tag }}\` |"   >> "$GITHUB_STEP_SUMMARY"
          echo "| \`goose\`       | \`latest\`, \`${{ steps.versions.outputs.goose_tag }}\` |"      >> "$GITHUB_STEP_SUMMARY"
          echo "| \`kilocode\`    | \`latest\`, \`${{ steps.versions.outputs.kilocode_tag }}\` |"   >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> After this run, apply \`registry.json\` to your cluster to use the \`:latest\` images." >> "$GITHUB_STEP_SUMMARY"
