name: Release Build - Multiarch

on:
  workflow_dispatch:
    inputs:
      claude_version:
        description: "Claude Code version (leave empty to use Dockerfile default)"
        required: false
        default: ''
      gemini_version:
        description: "Gemini CLI version (leave empty to use Dockerfile default)"
        required: false
        default: ''
      opencode_version:
        description: "OpenCode version, without leading v (leave empty to use Dockerfile default)"
        required: false
        default: ''

env:
  REGISTRY: quay.io/che-incubator/dashboard-ai

jobs:

  release:
    runs-on: ubuntu-22.04
    steps:
      -
        name: "Checkout source code"
        uses: actions/checkout@v4
      -
        name: "Resolve versions (input overrides Dockerfile default)"
        id: versions
        env:
          INPUT_CLAUDE: ${{ github.event.inputs.claude_version }}
          INPUT_GEMINI: ${{ github.event.inputs.gemini_version }}
          INPUT_OPENCODE: ${{ github.event.inputs.opencode_version }}
        run: |
          DF_CLAUDE=$(grep -m1 'ARG CLAUDE_CODE_VERSION=' dockerfiles/claude-code/Dockerfile | cut -d= -f2)
          DF_GEMINI=$(grep -m1 'ARG GEMINI_CLI_VERSION=' dockerfiles/gemini-cli/Dockerfile | cut -d= -f2)
          DF_OPENCODE=$(grep -m1 'ARG OPENCODE_VERSION=' dockerfiles/opencode/Dockerfile | cut -d= -f2 | sed 's/^v//')

          CLAUDE="${INPUT_CLAUDE:-$DF_CLAUDE}"
          GEMINI="${INPUT_GEMINI:-$DF_GEMINI}"
          OPENCODE="${INPUT_OPENCODE:-$DF_OPENCODE}"

          DATE=$(date +%Y%m%d)
          echo "claude=${CLAUDE}"    >> "$GITHUB_OUTPUT"
          echo "gemini=${GEMINI}"    >> "$GITHUB_OUTPUT"
          echo "opencode=${OPENCODE}" >> "$GITHUB_OUTPUT"
          echo "claude_tag=${CLAUDE}-${DATE}"    >> "$GITHUB_OUTPUT"
          echo "gemini_tag=${GEMINI}-${DATE}"    >> "$GITHUB_OUTPUT"
          echo "opencode_tag=${OPENCODE}-${DATE}" >> "$GITHUB_OUTPUT"
      -
        name: "Set up QEMU"
        uses: docker/setup-qemu-action@v3
      -
        name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
      -
        name: "Login to Quay.io"
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      -
        name: "Build and push claude-code"
        uses: docker/build-push-action@v5
        with:
          context: ./dockerfiles/claude-code
          file: ./dockerfiles/claude-code/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            CLAUDE_CODE_VERSION=${{ steps.versions.outputs.claude }}
          tags: |
            ${{ env.REGISTRY }}/claude-code:latest
            ${{ env.REGISTRY }}/claude-code:${{ steps.versions.outputs.claude_tag }}
      -
        name: "Build and push gemini-cli"
        uses: docker/build-push-action@v5
        with:
          context: ./dockerfiles/gemini-cli
          file: ./dockerfiles/gemini-cli/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            GEMINI_CLI_VERSION=${{ steps.versions.outputs.gemini }}
          tags: |
            ${{ env.REGISTRY }}/gemini-cli:latest
            ${{ env.REGISTRY }}/gemini-cli:${{ steps.versions.outputs.gemini_tag }}
      -
        name: "Build and push opencode"
        uses: docker/build-push-action@v5
        with:
          context: ./dockerfiles/opencode
          file: ./dockerfiles/opencode/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          build-args: |
            OPENCODE_VERSION=v${{ steps.versions.outputs.opencode }}
          tags: |
            ${{ env.REGISTRY }}/opencode:latest
            ${{ env.REGISTRY }}/opencode:${{ steps.versions.outputs.opencode_tag }}
